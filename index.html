<!doctype html>
<!-- Simple HTML Game: Avoider
     - Single-file HTML + JS
     - Controls: Arrow keys / WASD or touch/drag on mobile
     - Objective: Avoid falling enemies, score increases with time
     - Features: Responsive, pause, restart, high-score saved in localStorage
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Avoider Game</title>
  <style>
    :root{--bg:#0b1220;--card:#0f1724;--accent:#6ee7b7;--danger:#ff6b6b}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#071028 0%,#081029 100%);color:#e6eef8}
    .wrap{width:min(920px,96vw);max-width:920px;margin:20px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
    h1{font-size:18px;margin:0}
    .ui{display:flex;gap:8px;align-items:center}
    button{background:var(--card);border:1px solid rgba(255,255,255,0.06);color:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
    button:active{transform:translateY(1px)}
    canvas{display:block;width:100%;border-radius:10px;box-shadow:0 8px 30px rgba(2,6,23,0.7);background:linear-gradient(180deg,#071428,#00121a)}
    .info{display:flex;gap:12px;align-items:center;font-size:14px;margin-top:8px}
    .badge{background:rgba(255,255,255,0.03);padding:6px 8px;border-radius:8px}
    .controls{font-size:13px;color:rgba(230,238,248,0.8)}
    footer{margin-top:10px;font-size:12px;color:rgba(230,238,248,0.6)}
    @media (max-width:480px){h1{font-size:16px}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Simple Avoider — dodge the falling blocks</h1>
      <div class="ui">
        <button id="startBtn">Start</button>
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
      </div>
    </header>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="info">
      <div class="badge">Score: <span id="score">0</span></div>
      <div class="badge">High: <span id="highScore">0</span></div>
      <div class="controls">Controls: Arrow keys / WASD — or drag on touch</div>
    </div>

    <footer>Touch and drag to move the player on mobile. The game saves the high score locally.</footer>
  </div>

<script>
(() => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // UI
  const startBtn = document.getElementById('startBtn');
  const pauseBtn = document.getElementById('pauseBtn');
  const restartBtn = document.getElementById('restartBtn');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');

  // Game state
  let w = canvas.width, h = canvas.height;
  let running = false, paused = false;
  let lastTime = 0, spawnAcc = 0;
  let score = 0, highScore = 0;

  const STORAGE_KEY = 'simpleAvoiderHighScore_v1';
  highScore = Number(localStorage.getItem(STORAGE_KEY) || 0);
  highScoreEl.textContent = highScore;

  function resizeCanvas() {
    // Keep internal resolution and scale to css size to preserve crispness
    const ratio = Math.min(1.5, window.devicePixelRatio || 1);
    const cssW = Math.min(920, window.innerWidth * 0.96);
    const cssH = Math.round(cssW * 0.625);
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';
    w = canvas.width = Math.round(cssW * ratio);
    h = canvas.height = Math.round(cssH * ratio);
    ctx.setTransform(1,0,0,1,0,0);
    ctx.scale(ratio, ratio);
  }
  window.addEventListener('resize', resizeCanvas, {passive:true});
  resizeCanvas();

  // Player
  const player = {x: w/4, y: h - 80, r: 18, speed: 6, vx:0, vy:0, color:'#6ee7b7'};

  // Enemies
  const enemies = [];

  function spawnEnemy() {
    const size = 18 + Math.random()*36;
    const x = 20 + Math.random()*( (w/ (window.devicePixelRatio||1)) - 40 - size );
    const speed = 1.2 + Math.random()*3 + Math.min(4, score/50);
    enemies.push({x, y: -size, w:size, h:size, speed});
  }

  // Input handling (keyboard & pointer)
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // Pointer for touch/mouse drag
  let pointerDown = false;
  function toLocal(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x: (p.clientX - rect.left), y: (p.clientY - rect.top)};
  }
  canvas.addEventListener('pointerdown', e => { pointerDown = true; const p = toLocal(e); player.x = p.x; player.y = p.y; });
  window.addEventListener('pointermove', e => { if(pointerDown){ const p = toLocal(e); player.x = p.x; player.y = p.y; }});
  window.addEventListener('pointerup', ()=> pointerDown = false);

  // Simple collision: circle vs rect
  function circleRectCollide(cx, cy, r, rx, ry, rw, rh){
    const closestX = Math.max(rx, Math.min(cx, rx+rw));
    const closestY = Math.max(ry, Math.min(cy, ry+rh));
    const dx = cx - closestX, dy = cy - closestY;
    return (dx*dx+dy*dy) < r*r;
  }

  function update(dt){
    if(!running || paused) return;

    // Move player with keyboard
    const moveSpeed = player.speed;
    let dx = 0, dy = 0;
    if(keys['arrowleft']||keys['a']) dx -= moveSpeed;
    if(keys['arrowright']||keys['d']) dx += moveSpeed;
    if(keys['arrowup']||keys['w']) dy -= moveSpeed;
    if(keys['arrowdown']||keys['s']) dy += moveSpeed;

    player.x += dx; player.y += dy;
    // Clamp inside canvas
    const cssW = parseFloat(canvas.style.width);
    const cssH = parseFloat(canvas.style.height);
    player.x = Math.max(player.r, Math.min(cssW - player.r, player.x));
    player.y = Math.max(player.r, Math.min(cssH - player.r, player.y));

    // Spawn enemies faster as score grows
    spawnAcc += dt;
    const spawnInterval = Math.max(0.25, 1.0 - Math.min(0.7, score/200));
    if(spawnAcc > spawnInterval){ spawnAcc = 0; spawnEnemy(); }

    // Update enemies
    for(let i=enemies.length-1;i>=0;i--){
      const e = enemies[i];
      e.y += e.speed * (60*dt); // scale to approx px/frame
      if(e.y > cssH + 50) enemies.splice(i,1);
      else if(circleRectCollide(player.x, player.y, player.r, e.x, e.y, e.w, e.h)){
        running = false; // game over
      }
    }

    // Score increases with time alive
    score += dt * 10;
    scoreEl.textContent = Math.floor(score);
  }

  function draw(){
    // Clear
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // Background subtle grid
    const cssW = parseFloat(canvas.style.width);
    const cssH = parseFloat(canvas.style.height);
    ctx.fillStyle = 'rgba(255,255,255,0.01)';
    for(let i=0;i<20;i++){
      ctx.fillRect(i*(cssW/20),0,1,cssH);
    }

    // Draw player
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fillStyle=player.color; ctx.fill();
    ctx.closePath();

    // Draw enemies
    enemies.forEach(e=>{
      ctx.fillStyle = 'rgba(255,107,107,0.95)';
      ctx.fillRect(e.x, e.y, e.w, e.h);
    });

    // HUD
    if(!running){
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(cssW/2 - 160, cssH/2 - 50, 320, 100);
      ctx.fillStyle = '#e6eef8';
      ctx.textAlign = 'center'; ctx.font = '18px system-ui';
      ctx.fillText('Game Over — Score: ' + Math.floor(score), cssW/2, cssH/2 - 6);
      ctx.font = '13px system-ui';
      ctx.fillText('Press Start or Restart to try again', cssW/2, cssH/2 + 18);
    }
  }

  // Main loop
  function loop(ts){
    if(!lastTime) lastTime = ts;
    const dt = Math.min(0.05,(ts - lastTime)/1000); // cap delta
    lastTime = ts;
    update(dt);
    draw();

    if(!running){
      // when game stops, save high score
      const sc = Math.floor(score);
      if(sc > highScore){ highScore = sc; localStorage.setItem(STORAGE_KEY, highScore); highScoreEl.textContent = highScore; }
    }
    requestAnimationFrame(loop);
  }

  // Controls
  startBtn.addEventListener('click', ()=>{
    if(!running){ startGame(); }
    paused = false; startBtn.disabled = true; pauseBtn.disabled = false;
  });
  pauseBtn.addEventListener('click', ()=>{ paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; });
  restartBtn.addEventListener('click', ()=>{ resetGame(); startGame(); });

  function startGame(){
    running = true; paused = false; lastTime = 0; score = 0; spawnAcc = 0; enemies.length = 0;
    // Position player in center-bottom
    const cssW = parseFloat(canvas.style.width), cssH = parseFloat(canvas.style.height);
    player.x = cssW/2; player.y = cssH - 60;
  }
  function resetGame(){
    running = false; paused = false; enemies.length = 0; score = 0; scoreEl.textContent = 0; startBtn.disabled = false; pauseBtn.disabled = false; pauseBtn.textContent='Pause';
  }

  // Start loop
  requestAnimationFrame(loop);

  // Start button initial state
  startBtn.disabled = false; pauseBtn.disabled = true;

  // Simple touch guidance for mobile: make canvas focusable
  canvas.tabIndex = 1000;

  // Expose for debugging in console
  window.__game = {startGame, resetGame, enemies, player};
})();
</script>
</body>
</html>
