<!doctype html>
<!--
Fixed Mario-like platformer (single-file)
- Prevents player falling by auto-creating ground if missing
- Ensures spawn above ground and visible
- Auto-starts (click/tap canvas to start & unlock audio)
- Works on desktop, mobile, and GitHub Pages
- Screenshot reference (for debugging): /mnt/data/Screenshot (9).png
Save as: mario_fixed.html
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fixed Mini Platformer</title>
<style>
  :root{
    --bg1:#87ceeb; --bg2:#6fb8e6; --ground:#4a7a1b; --platform:#8b5a2b;
    --player:#ff2f6d; --coin:#ffd54a; --enemy:#e24b4b;
  }
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial;background:linear-gradient(var(--bg1),var(--bg2));}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:12px;box-sizing:border-box}
  canvas{display:block;width:100%;max-width:1200px;height:66vh;border-radius:10px;box-shadow:0 12px 40px rgba(7,22,40,0.35);background:transparent}
  .uiTop{position:fixed;left:18px;top:16px;color:#023047;font-weight:700}
  .uiTop div{background:rgba(255,255,255,0.95);padding:8px 10px;border-radius:8px;margin-bottom:6px;box-shadow:0 4px 8px rgba(0,0,0,0.08)}
  .controls{position:fixed;right:18px;top:16px;display:flex;gap:8px}
  button{background:#fff;padding:8px 12px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);cursor:pointer;font-weight:700}
  #startScreen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.97);padding:18px;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,0.25);text-align:center;min-width:280px}
  #startScreen h1{margin:0 0 6px 0;font-size:20px}
  .mobileControls{position:fixed;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:14px;pointer-events:none}
  .touchBtn{width:72px;height:72px;border-radius:14px;background:rgba(255,255,255,0.92);display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,0.12);pointer-events:auto;user-select:none}
  @media(min-width:980px){ .mobileControls{display:none} }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720" aria-label="Platformer canvas"></canvas>
  </div>

  <div class="uiTop">
    <div id="levelLabel">Level 1</div>
    <div id="scoreLabel">Coins: 0</div>
    <div id="livesLabel">Lives: 3</div>
  </div>

  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
  </div>

  <div id="startScreen">
    <h1>Fixed Mini Platformer</h1>
    <p style="margin:6px 0;color:#334155;font-size:13px">Click "Play" or tap the canvas to start. Player will always spawn above ground.</p>
    <div style="margin-top:12px">
      <button id="playBtn">Play</button>
      <button id="helpBtn">How to Play</button>
    </div>
    <p id="helpText" style="margin-top:10px;color:#334155;font-size:13px;display:none">Move: ← → or A/D. Jump: ↑ or Space. Stomp enemies to defeat them. Collect coins.</p>
  </div>

  <div class="mobileControls" aria-hidden="false">
    <div id="leftBtn" class="touchBtn">◀</div>
    <div id="jumpBtn" class="touchBtn">▲</div>
    <div id="rightBtn" class="touchBtn">▶</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const startScreen = document.getElementById('startScreen');
  const playBtn = document.getElementById('playBtn'), helpBtn = document.getElementById('helpBtn'), helpText = document.getElementById('helpText');
  const pauseBtn = document.getElementById('pauseBtn'), restartBtn = document.getElementById('restartBtn');
  const levelLabel = document.getElementById('levelLabel'), scoreLabel = document.getElementById('scoreLabel'), livesLabel = document.getElementById('livesLabel');
  const leftBtn = document.getElementById('leftBtn'), rightBtn = document.getElementById('rightBtn'), jumpBtn = document.getElementById('jumpBtn');

  const TILE = 48;
  let W = canvas.width, H = canvas.height;

  // minimal level set. If bottom row has no ground, code will create one automatically.
  const levelDataRaw = [
    [
      '                                ',
      '                                ',
      '                                ',
      '                                ',
      '           c    p    c          ',
      '      p              p         ',
      '         e       s              ',
      '                                ',
      '                                ',
      '                                '
    ]
  ];

  // Parse helper -> numeric map: 0 empty; 1 = ground; 2 = platform; 3 = coin; 4 = spike; 5 = enemy; 6 = flag
  function parseLevel(arr){
    return arr.map(r => r.split('').map(ch => {
      switch(ch){ case '1': return 1; case 'p': return 2; case 'c': return 3; case 's': return 4; case 'e': return 5; case 'f': return 6; default: return 0; }
    }));
  }

  // Ensure level has a ground row: if none found, add ground at bottom
  function ensureGround(map){
    const rows = map.length, cols = map[0].length;
    let hasGround = false;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){ if(map[r][c] === 1) { hasGround = true; break; } }
      if(hasGround) break;
    }
    if(!hasGround){
      // put ground on last row
      for(let c=0;c<cols;c++) map[rows-1][c] = 1;
    }
    return map;
  }

  // convert raw -> numeric map
  let currentLevel = 0;
  let map = parseLevel(levelDataRaw[currentLevel]);
  map = ensureGround(map); // FIX: guarantee floor
  let mapRows = map.length, mapCols = (map[0]||[]).length || 32;

  // player spawn: find first ground tile column and spawn slightly above it
  function computeSpawn(){
    // find left-most ground tile in bottom rows
    for(let r = mapRows-1; r>=0; r--){
      for(let c=0;c<mapCols;c++){
        if(map[r][c] === 1){
          // spawn two tiles left of this ground tile center
          const spawnX = Math.max(TILE*1.5, c*TILE + TILE/2 - TILE*2);
          const spawnY = r*TILE - TILE; // one tile above ground
          return {x: spawnX, y: spawnY};
        }
      }
    }
    // fallback center
    return {x: TILE*2, y: TILE*(mapRows-3)};
  }

  // now set player
  const player = { x:0, y:0, w:36, h:44, vx:0, vy:0, speed:240, jumpPower:520, onGround:false, doubleJump:true, facing:1 };
  const spawn = computeSpawn();
  player.x = spawn.x; player.y = spawn.y;

  // enemies array
  let enemies = [];
  function loadEnemies(){
    enemies = [];
    for(let r=0;r<mapRows;r++){
      for(let c=0;c<mapCols;c++){
        if(map[r][c] === 5){
          enemies.push({x:c*TILE + TILE/2, y:r*TILE + TILE/2, w:36, h:36, dir:-1, speed:80});
        }
      }
    }
  }
  loadEnemies();

  // camera
  let cameraX = 0;

  // coins & lives
  let coins = 0, lives = 3;

  // Running state
  let running = false, paused = false;

  // Input
  const keys = {};
  window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key === ' ') e.preventDefault(); });
  window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // Touch buttons
  let touchLeft=false, touchRight=false, touchJump=false;
  function bindTouch(el, set) {
    el.addEventListener('pointerdown', e => { set(true); e.preventDefault(); });
    window.addEventListener('pointerup', e => { set(false); });
    el.addEventListener('pointercancel', e => { set(false); });
  }
  bindTouch(leftBtn, v => touchLeft = v);
  bindTouch(rightBtn, v => touchRight = v);
  bindTouch(jumpBtn, v => touchJump = v);

  // Controls
  playBtn.addEventListener('click', () => startGame());
  helpBtn.addEventListener('click', ()=> helpText.style.display = helpText.style.display === 'none' ? 'block' : 'none');
  pauseBtn.addEventListener('click', ()=> { paused = !paused; pauseBtn.textContent = paused ? 'Resume' : 'Pause'; });
  restartBtn.addEventListener('click', ()=> { resetLevel(); startGame(); });

  // Utility: get tile at world position
  function tileAt(px, py){
    const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
    if(c < 0 || c >= mapCols || r < 0 || r >= mapRows) return 0;
    return map[r][c];
  }
  function isSolid(t){ return t === 1 || t === 2; }

  // Collision for AABB entities
  function collideEntity(e, dt){
    // horizontal
    e.x += e.vx * dt;
    let left = e.x - e.w/2, right = e.x + e.w/2, top = e.y - e.h/2, bottom = e.y + e.h/2;
    let c0 = Math.floor(left / TILE), c1 = Math.floor(right / TILE), r0 = Math.floor(top / TILE), r1 = Math.floor(bottom / TILE);
    for(let r=r0; r<=r1; r++){
      for(let c=c0; c<=c1; c++){
        if(r<0 || r>=mapRows || c<0 || c>=mapCols) continue;
        const t = map[r][c];
        if(isSolid(t)){
          const tx = c*TILE, ty = r*TILE;
          if(right > tx && left < tx+TILE && bottom > ty && top < ty+TILE){
            if(e.vx > 0) e.x = tx - e.w/2
